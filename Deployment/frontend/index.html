<!DOCTYPE html>
<html>
<head>
  <title>AI Price Optima</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #ffd6e8);
    }

    .container {
      display: flex;
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 20px;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .left {
      width: 35%;
      padding: 30px;
      background: #fff0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .right {
      width: 65%;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #d63384;
    }

    h3 {
      color: #a61e4d;
    }

    input {
      padding: 10px;
      width: 80%;
      border-radius: 20px;
      border: 1px solid #ff99bb;
      margin: 10px;
      outline: none;
    }

    input:focus {
      border-color: #ff4d88;
      box-shadow: 0 0 8px #ff99bb;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border-radius: 25px;
      border: none;
      background: #ff4d88;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e6005c;
      transform: scale(1.05);
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #b30059;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">
    <h1>AI Price Optimization</h1>
    <h3>Enter Details</h3>

    <input id="price" placeholder="Price">
    <input id="inventory" placeholder="Inventory Level">
    <input id="demand" placeholder="Demand Forecast">
    <input id="visitors" placeholder="Visitors">

    <button onclick="predict()">Predict</button>
    <button onclick="loadGraph()">Show Graph</button>

    <h2 id="result"></h2>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <canvas id="chart"></canvas>
  </div>

</div>

<script>

let chartInstance = null;

// 🔹 PREDICT
async function predict() {

  let data = {
    price: Number(document.getElementById("price").value),
    inventory_level: Number(document.getElementById("inventory").value),
    demand_forecast: Number(document.getElementById("demand").value),
    visitors: Number(document.getElementById("visitors").value),

    units_ordered: 30,
    discount: 5,
    cost: 60,
    is_weekend: 1,
    month: 4
  };

  let res = await fetch("http://127.0.0.1:8000/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  let result = await res.json();

  document.getElementById("result").innerText =
    "Prediction: " + result.prediction.toFixed(2);
}


// 🔹 GRAPH
async function loadGraph() {

  let data = {
    inventory_level: Number(document.getElementById("inventory").value),
    demand_forecast: Number(document.getElementById("demand").value),
    visitors: Number(document.getElementById("visitors").value),

    units_ordered: 30,
    discount: 5,
    cost: 60,
    is_weekend: 1,
    month: 4
  };

  let res = await fetch("http://127.0.0.1:8000/graph", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  let graphData = await res.json();

  // Destroy old chart before creating new
  if (chartInstance) {
    chartInstance.destroy();
  }

  chartInstance = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: graphData.prices,
      datasets: [{
        label: "Price vs Prediction",
        data: graphData.predictions
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

</script>

</body>
</html>
